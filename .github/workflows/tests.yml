name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy .

      - name: Run pyflakes
        run: pyflakes dynasty_dashboard tests scripts/scraper_smoke_test.py

      - name: Run tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -p "test_*.py" -v

      - name: Test trade calculator validation and rendering
        run: |
          php scripts/test_trade_calculator_validation.php
          php scripts/test_trade_calculator_rendering.php
          php scripts/test_trade_calculator_failures.php

      - name: Test Predictions access and roster handling
        run: php scripts/test_predictions_access_and_roster.php

      - name: Test Predictions projection engine
        run: php scripts/test_predictions_projection_engine.php

      - name: Test Predictions card submission
        run: php scripts/test_predictions_card_submission.php

      - name: Test Predictions results and leaderboard
        run: php scripts/test_predictions_results.php

      - name: Test Predictions deployment integration
        run: php scripts/test_predictions_deployment.php
