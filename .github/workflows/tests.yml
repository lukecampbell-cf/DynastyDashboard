name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy .

      - name: Run pyflakes
        run: pyflakes dynasty_dashboard tests scripts/scraper_smoke_test.py

      - name: Run tests
        run: python -m unittest discover -p "test_*.py" -v

      - name: Run Predictions Phase 1 tests
        run: php scripts/test_predictions_phase1.php

      - name: Run Predictions Phase 2 tests
        run: php scripts/test_predictions_phase2.php

      - name: Run Predictions Phase 4 tests
        run: php scripts/test_predictions_phase4.php

      - name: Run Predictions Phase 5 tests
        run: php scripts/test_predictions_phase5.php

      - name: Run Predictions Phase 6 integration tests
        run: php scripts/test_predictions_phase6.php
